name: Daily scan
on:
  schedule:
    - cron: '45 6 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: combined
        options: [yang, sepa, combined]
permissions:
  contents: read
concurrency:
  group: daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scan.py --mode "$MODE"
        env:
          MODE: ${{ inputs.mode || 'combined' }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 90
      - run: python notify.py
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
